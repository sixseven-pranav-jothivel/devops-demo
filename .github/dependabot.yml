# Dependency update PRs. Every update goes through the normal quality gates and a human review.
# GitHub Actions: Dependabot understands full-SHA pins with a trailing "# vX.Y.Z" comment and bumps both.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]

  # uv.lock / pyproject.toml (Dependabot's uv ecosystem keeps the lockfile consistent)
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels: [dependencies, python]
    open-pull-requests-limit: 5

  # Dockerfile FROM lines: python:3.12-slim@sha256 and the pinned uv image digest
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"
    labels: [dependencies, docker]
