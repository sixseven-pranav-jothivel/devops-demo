name: Set up Python environment
description: Install the pinned uv and sync the locked dependencies (uv sync --frozen).
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.24"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      shell: bash
      run: uv sync --frozen
