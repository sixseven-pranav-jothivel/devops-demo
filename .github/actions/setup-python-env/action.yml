name: Set up Python environment
description: Install the pinned uv and sync the locked dependencies (uv sync --frozen).
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.12.24"
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install locked dependencies
      shell: bash
      run: uv sync --frozen
